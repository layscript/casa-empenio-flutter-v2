name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: casa-empenio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK con enlace fijo
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk casa-empenio.apk
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create apk-latest --repo "$GITHUB_REPOSITORY" --title "APK más reciente" --notes "APK de la app"
          gh release upload apk-latest casa-empenio.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit apk-latest --repo "$GITHUB_REPOSITORY" --notes "Compilado el $(date -u '+%d/%m/%Y %H:%M') UTC · versión ${GITHUB_SHA::7}"
          # Registro numerado de la actualización (la app lo lee para avisar y mostrar el historial)
          MSG=$(printf '%s' "$COMMIT_MSG" | grep -v '^Co-Authored-By' | grep -v '^Claude-Session' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          [ -z "$MSG" ] && MSG="Mejoras y correcciones"
          gh release create "build-${{ github.run_number }}" --repo "$GITHUB_REPOSITORY" --title "Actualización ${{ github.run_number }}" --notes "$MSG" --latest=false || true
          # Cada actualización guarda su propio APK (se conservan las últimas 5 por si hay que volver atrás)
          gh release upload "build-${{ github.run_number }}" casa-empenio.apk --clobber --repo "$GITHUB_REPOSITORY" || true
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 60 --json tagName -q '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +6); do
            gh release delete-asset "$tag" casa-empenio.apk --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          done
