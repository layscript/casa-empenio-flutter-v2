name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: casa-empenio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar APK con enlace fijo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk casa-empenio.apk
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create apk-latest --repo "$GITHUB_REPOSITORY" --title "APK más reciente" --notes "APK de la app"
          gh release upload apk-latest casa-empenio.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit apk-latest --repo "$GITHUB_REPOSITORY" --notes "Compilado el $(date -u '+%d/%m/%Y %H:%M') UTC · versión ${GITHUB_SHA::7}"
