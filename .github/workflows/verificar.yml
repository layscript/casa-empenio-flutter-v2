name: Verificar
on:
  push:
    branches: [verificar5]
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/a.txt 2>&1; grep -E "^\s*error" /tmp/a.txt | while read l; do echo "::error::$l"; done; ! grep -qE "^\s*error" /tmp/a.txt
