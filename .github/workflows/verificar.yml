name: verificar
on:
  push:
    branches: [audit-mod-1]
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: stable
      - run: flutter pub get
      - name: analizar
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/presentation/features/home/bloc lib/presentation/features/home/view lib/presentation/features/home/features/main lib/presentation/app/utils/icon_appbar.dart > out.txt || true
          grep -E "^\s*error" out.txt | head -40 | while read -r l; do echo "::error::$l"; done
          echo "::warning::RESUMEN errores=$(grep -cE '^\s*error' out.txt) lineas=$(wc -l < out.txt)"
