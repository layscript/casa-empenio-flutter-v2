name: verificar
on:
  push:
    branches: [verificar-rrhh]
jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/presentation/app/utils/rrhh_view.dart lib/presentation/app/utils/rrhh_pdf.dart lib/presentation/features/home/features/main/views/main.dart lib/presentation/app/utils/modulo_pantalla.dart > out.txt 2>&1 || true
          grep -E " error | warning " out.txt | head -c 4000 | while IFS= read -r l; do echo "::error::$l"; done
          ! grep -q " error " out.txt
