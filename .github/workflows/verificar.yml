name: verificar
on:
  push:
    branches: [verificar15]
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > out.txt 2>&1 || true
          grep -E "^\s*error •" out.txt | while read -r l; do echo "::error::$l"; done
          if grep -qE "^\s*error •" out.txt; then exit 1; fi
