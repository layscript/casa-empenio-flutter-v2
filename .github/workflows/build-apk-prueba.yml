name: Compilar APK de PRUEBA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_PRUEBA: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: stable
          cache: true
      - name: Ícono distinto para la app de PRUEBA (franja roja)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core
          CONV=$(command -v magick || command -v convert)
          for f in android/app/src/main/res/mipmap-*/launcher_icon.png android/app/src/main/res/mipmap-*/ic_launcher.png; do
            [ -f "$f" ] || continue
            W=$(identify -format %w "$f"); H=$(identify -format %h "$f")
            B=$((H*40/100)); Y=$((H-B))
            $CONV "$f" -fill 'rgba(200,0,0,0.92)' -draw "rectangle 0,$Y $W,$H" -fill white -font DejaVu-Sans-Bold -gravity south -pointsize $((H*22/100)) -annotate +0+$((H*6/100)) 'PRUEBA' "$f"
          done
      - run: flutter pub get
      # Apunta al servidor de prueba (base de datos aparte). No genera avisos de actualización para la app real.
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=PRUEBA=true --dart-define=SERVIDOR=http://04k65lhlpeqxzf1kzu9mmyhm.86.48.22.211.sslip.io
      - name: Publicar APK de prueba con enlace fijo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk casa-empenio-prueba.apk
          gh release view apk-prueba --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create apk-prueba --repo "$GITHUB_REPOSITORY" --title "APK de PRUEBA" --notes "App de prueba (servidor de prueba)" --latest=false
          gh release upload apk-prueba casa-empenio-prueba.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit apk-prueba --repo "$GITHUB_REPOSITORY" --latest=false --notes "App de PRUEBA compilada el $(date -u '+%d/%m/%Y %H:%M') UTC · versión ${GITHUB_SHA::7}"
