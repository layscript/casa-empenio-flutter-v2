name: Probar cambios (antes de publicar)
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: stable
          cache: true
      - run: flutter pub get
      # Pruebas de pantallas: abren la pantalla real con el tema de la app y revisan que se vea todo sin errores
      - run: flutter test test/pantallas
