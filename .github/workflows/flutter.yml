name: Flutter CI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.5"
          channel: "stable"
          cache: true

      # Removemos pasos innecesarios y dejamos solo lo esencial
      - name: Instalar dependencias
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP archive
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../windows-release.zip *

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: windows-release.zip
          body: |
            ## Instrucciones de instalación
            1. Descarga el archivo windows-release.zip
            2. Extrae el contenido
            3. Ejecuta el archivo .exe dentro de la carpeta extraída