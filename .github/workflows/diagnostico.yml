name: Diagnostico
on:
  push:
    branches: [prueba-categorias]
jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analizar
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee salida.txt || true
          grep -E "^\s*error •" salida.txt | while IFS= read -r l; do echo "::error::$l"; done
          if grep -qE "^\s*error •" salida.txt; then exit 1; fi
